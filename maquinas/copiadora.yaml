# Transforma w en w#w, conservando el original y el orden de sus símbolos.
q_states:
  q_list: [q0, q1, q2, q3, q4, q5]
  initial: q0
  final: q5
alphabet: [a, b]
tape_alphabet: [a, b, "#", X, null]

delta:
  # q0: escribir el separador después del original.
  - params: {initial_state: q0, mem_cache_value: null, tape_input: a}
    output: {final_state: q0, mem_cache_value: null, tape_output: a, tape_displacement: R}
  - params: {initial_state: q0, mem_cache_value: null, tape_input: b}
    output: {final_state: q0, mem_cache_value: null, tape_output: b, tape_displacement: R}
  - params: {initial_state: q0, mem_cache_value: null, tape_input: null}
    output: {final_state: q1, mem_cache_value: null, tape_output: "#", tape_displacement: L}

  # q1: regresar al inicio de la entrada.
  - params: {initial_state: q1, mem_cache_value: null, tape_input: a}
    output: {final_state: q1, mem_cache_value: null, tape_output: a, tape_displacement: L}
  - params: {initial_state: q1, mem_cache_value: null, tape_input: b}
    output: {final_state: q1, mem_cache_value: null, tape_output: b, tape_displacement: L}
  - params: {initial_state: q1, mem_cache_value: null, tape_input: null}
    output: {final_state: q2, mem_cache_value: null, tape_output: null, tape_displacement: R}

  # q2: marcar una única posición pendiente y recordar su símbolo.
  - params: {initial_state: q2, mem_cache_value: null, tape_input: a}
    output: {final_state: q3, mem_cache_value: a, tape_output: X, tape_displacement: R}
  - params: {initial_state: q2, mem_cache_value: null, tape_input: b}
    output: {final_state: q3, mem_cache_value: b, tape_output: X, tape_displacement: R}
  - params: {initial_state: q2, mem_cache_value: null, tape_input: "#"}
    output: {final_state: q5, mem_cache_value: null, tape_output: "#", tape_displacement: S}

  # q3: llevar el símbolo recordado hasta el primer blanco a la derecha.
  - params: {initial_state: q3, mem_cache_value: a, tape_input: a}
    output: {final_state: q3, mem_cache_value: a, tape_output: a, tape_displacement: R}
  - params: {initial_state: q3, mem_cache_value: a, tape_input: b}
    output: {final_state: q3, mem_cache_value: a, tape_output: b, tape_displacement: R}
  - params: {initial_state: q3, mem_cache_value: a, tape_input: "#"}
    output: {final_state: q3, mem_cache_value: a, tape_output: "#", tape_displacement: R}
  - params: {initial_state: q3, mem_cache_value: a, tape_input: null}
    output: {final_state: q4, mem_cache_value: a, tape_output: a, tape_displacement: L}
  - params: {initial_state: q3, mem_cache_value: b, tape_input: a}
    output: {final_state: q3, mem_cache_value: b, tape_output: a, tape_displacement: R}
  - params: {initial_state: q3, mem_cache_value: b, tape_input: b}
    output: {final_state: q3, mem_cache_value: b, tape_output: b, tape_displacement: R}
  - params: {initial_state: q3, mem_cache_value: b, tape_input: "#"}
    output: {final_state: q3, mem_cache_value: b, tape_output: "#", tape_displacement: R}
  - params: {initial_state: q3, mem_cache_value: b, tape_input: null}
    output: {final_state: q4, mem_cache_value: b, tape_output: b, tape_displacement: L}

  # q4: encontrar la X, restaurar el original y avanzar a la siguiente posición.
  - params: {initial_state: q4, mem_cache_value: a, tape_input: a}
    output: {final_state: q4, mem_cache_value: a, tape_output: a, tape_displacement: L}
  - params: {initial_state: q4, mem_cache_value: a, tape_input: b}
    output: {final_state: q4, mem_cache_value: a, tape_output: b, tape_displacement: L}
  - params: {initial_state: q4, mem_cache_value: a, tape_input: "#"}
    output: {final_state: q4, mem_cache_value: a, tape_output: "#", tape_displacement: L}
  - params: {initial_state: q4, mem_cache_value: a, tape_input: X}
    output: {final_state: q2, mem_cache_value: null, tape_output: a, tape_displacement: R}
  - params: {initial_state: q4, mem_cache_value: b, tape_input: a}
    output: {final_state: q4, mem_cache_value: b, tape_output: a, tape_displacement: L}
  - params: {initial_state: q4, mem_cache_value: b, tape_input: b}
    output: {final_state: q4, mem_cache_value: b, tape_output: b, tape_displacement: L}
  - params: {initial_state: q4, mem_cache_value: b, tape_input: "#"}
    output: {final_state: q4, mem_cache_value: b, tape_output: "#", tape_displacement: L}
  - params: {initial_state: q4, mem_cache_value: b, tape_input: X}
    output: {final_state: q2, mem_cache_value: null, tape_output: b, tape_displacement: R}

simulation_strings:
  - "abaab"
  - "bbaaba"
  - "aaaaa"
  - "bbbbb"

